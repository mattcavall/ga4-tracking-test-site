  <!-- Inline CSS: Dark mode, responsive design, zero animations, zero transitions -->
  <style>
    /* Reset and baseline styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: none !important;
      animation: none !important;
    }
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --accent: #2196f3;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      color: var(--text);
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 480px) {
      .button-group {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-block;
      padding: 14px 24px;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }
  </style>
