<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GA4 Promotion Test: Separate</title>
  <meta name="description" content="Separate promotion test page for GA4 promotion tracking" />

  <!-- Inline CSS: Strictly no animations or transitions -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: none !important;
      animation: none !important;
    }
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --accent: #2196f3;
      --banner-bg: #2a2a2a;
      --banner-border: #444444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 960px;
      height: 80px;
      max-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
    }
    h1 {
      font-size: 22px;
      color: var(--text);
    }
    .btn-home {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
    }
    #set-sep-atf, #set-sep-btf {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: row;
      gap: 12px;
      padding: 16px;
    }
    @media (max-width: 700px) {
      #set-sep-atf, #set-sep-btf {
        flex-direction: column;
        gap: 12px;
      }
    }
    .banner {
      flex: 1;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      border-radius: 6px;
      color: var(--text);
      padding: 12px;
      text-align: center;
      cursor: pointer;
    }
    .banner-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .banner-sub {
      font-size: 13px;
      color: var(--text-muted);
    }
    #spacer-fold {
      height: 150vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 14px;
    }
  </style>

  <!-- Pre-GTM dataLayer initialization with page_type and test_variant -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      page_type: "separate",
      test_variant: "separate"
    });
  </script>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KGTK8ZXX');</script>
  <!-- End Google Tag Manager -->
</head>
<body id="page-separate" data-testid="page-separate" data-step="step-2-test-page" data-ready="false" data-fold-set2-fired="false">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KGTK8ZXX"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- 1. Header (height at most 100px) -->
  <header>
    <h1>Separate Promotion Test</h1>
    <a href="index.html" id="link-home" data-testid="link-home" class="btn-home" aria-label="Home">Home</a>
  </header>

  <!-- 2. Above the fold (ATF) banner set -->
  <div id="set-sep-atf" data-testid="set-sep-atf">
    <a href="shop.html" class="banner" id="banner-sep-atf-1" data-testid="banner-sep-atf-1"
       data-promotion-id="sep-atf-1" data-promotion-name="Sep ATF Promo 1"
       data-creative-name="sep_atf_creative_1" data-creative-slot="sep_atf_slot_1"
       data-item-id="SKU-SEP-ATF-1" data-fold="atf" aria-label="Sep ATF Promo 1 sep-atf-1">
      <span class="banner-title">Sep ATF Promo 1</span>
      <span class="banner-sub">sep-atf-1</span>
    </a>
    <a href="shop.html" class="banner" id="banner-sep-atf-2" data-testid="banner-sep-atf-2"
       data-promotion-id="sep-atf-2" data-promotion-name="Sep ATF Promo 2"
       data-creative-name="sep_atf_creative_2" data-creative-slot="sep_atf_slot_2"
       data-item-id="SKU-SEP-ATF-2" data-fold="atf" aria-label="Sep ATF Promo 2 sep-atf-2">
      <span class="banner-title">Sep ATF Promo 2</span>
      <span class="banner-sub">sep-atf-2</span>
    </a>
    <a href="shop.html" class="banner" id="banner-sep-atf-3" data-testid="banner-sep-atf-3"
       data-promotion-id="sep-atf-3" data-promotion-name="Sep ATF Promo 3"
       data-creative-name="sep_atf_creative_3" data-creative-slot="sep_atf_slot_3"
       data-item-id="SKU-SEP-ATF-3" data-fold="atf" aria-label="Sep ATF Promo 3 sep-atf-3">
      <span class="banner-title">Sep ATF Promo 3</span>
      <span class="banner-sub">sep-atf-3</span>
    </a>
  </div>

  <!-- 3. Spacer fold (height 150vh) -->
  <div id="spacer-fold" data-testid="spacer-fold">Scroll down to view below-the-fold banners</div>

  <!-- 4. Below the fold (BTF) banner set -->
  <div id="set-sep-btf" data-testid="set-sep-btf">
    <a href="shop.html" class="banner" id="banner-sep-btf-1" data-testid="banner-sep-btf-1"
       data-promotion-id="sep-btf-1" data-promotion-name="Sep BTF Promo 1"
       data-creative-name="sep_btf_creative_1" data-creative-slot="sep_btf_slot_1"
       data-item-id="SKU-SEP-BTF-1" data-fold="btf" aria-label="Sep BTF Promo 1 sep-btf-1">
      <span class="banner-title">Sep BTF Promo 1</span>
      <span class="banner-sub">sep-btf-1</span>
    </a>
    <a href="shop.html" class="banner" id="banner-sep-btf-2" data-testid="banner-sep-btf-2"
       data-promotion-id="sep-btf-2" data-promotion-name="Sep BTF Promo 2"
       data-creative-name="sep_btf_creative_2" data-creative-slot="sep_btf_slot_2"
       data-item-id="SKU-SEP-BTF-2" data-fold="btf" aria-label="Sep BTF Promo 2 sep-btf-2">
      <span class="banner-title">Sep BTF Promo 2</span>
      <span class="banner-sub">sep-btf-2</span>
    </a>
    <a href="shop.html" class="banner" id="banner-sep-btf-3" data-testid="banner-sep-btf-3"
       data-promotion-id="sep-btf-3" data-promotion-name="Sep BTF Promo 3"
       data-creative-name="sep_btf_creative_3" data-creative-slot="sep_btf_slot_3"
       data-item-id="SKU-SEP-BTF-3" data-fold="btf" aria-label="Sep BTF Promo 3 sep-btf-3">
      <span class="banner-title">Sep BTF Promo 3</span>
      <span class="banner-sub">sep-btf-3</span>
    </a>
  </div>

  <!-- Core shared script -->
  <script src="shared.js"></script>

  <script>
    // Set 1 (ATF): On load: three view_promotion events, one per set1 banner.
    // Each event has event-level promotion fields equal to the banner values and an items array with one item.
    (function fireAtfSeparate() {
      for (let N = 1; N <= 3; N++) {
        const item = generateBanner("separate", "atf", N);
        const eventFields = {
          promotion_id: item.promotion_id,
          promotion_name: item.promotion_name,
          creative_name: item.creative_name,
          creative_slot: item.creative_slot,
          location_id: CONFIG.LOCATION_ID,
          currency: CONFIG.CURRENCY
        };
        push(CONFIG.EVENT_VIEW, eventFields, [item]);
      }
    })();

    // Set 2 (BTF): For set2: observe each banner. When 50 percent visible, push its view_promotion once per page load.
    (function observeBtfSeparate() {
      const btfBanners = document.querySelectorAll("#set-sep-btf .banner");
      let firedCount = 0;

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= CONFIG.VISIBILITY_THRESHOLD) {
            const el = entry.target;
            obs.unobserve(el);

            const fold = el.dataset.fold;
            const N = parseInt(el.dataset.itemId.split("-").pop(), 10);
            const item = generateBanner("separate", fold, N);
            const eventFields = {
              promotion_id: el.dataset.promotionId,
              promotion_name: el.dataset.promotionName,
              creative_name: el.dataset.creativeName,
              creative_slot: el.dataset.creativeSlot,
              location_id: CONFIG.LOCATION_ID,
              currency: CONFIG.CURRENCY
            };

            push(CONFIG.EVENT_VIEW, eventFields, [item]);
            firedCount++;
            if (firedCount >= btfBanners.length) {
              document.body.setAttribute("data-fold-set2-fired", "true");
            }
          }
        });
      }, {
        threshold: [CONFIG.VISIBILITY_THRESHOLD]
      });

      btfBanners.forEach(b => observer.observe(b));
    })();

    // Banner click handling
    document.querySelectorAll(".banner").forEach(bannerEl => {
      bannerEl.addEventListener("click", function(e) {
        e.preventDefault();

        const promoId = bannerEl.dataset.promotionId;
        const promoName = bannerEl.dataset.promotionName;
        const creativeName = bannerEl.dataset.creativeName;
        const creativeSlot = bannerEl.dataset.creativeSlot;
        const fold = bannerEl.dataset.fold;
        const N = parseInt(bannerEl.dataset.itemId.split("-").pop(), 10);

        // 1. Build item from generator
        const clickedItem = generateBanner("separate", fold, N);

        // 2. Save active_promo in sessionStorage: promotion_id, promotion_name, creative_name, creative_slot, test_variant
        const activePromo = {
          promotion_id: promoId,
          promotion_name: promoName,
          creative_name: creativeName,
          creative_slot: creativeSlot,
          test_variant: "separate"
        };
        sessionStorage.setItem("active_promo", JSON.stringify(activePromo));
        sessionStorage.setItem("test_variant", "separate");

        // 3. Redirect once guard and fallback timer
        let redirected = false;
        function doRedirect() {
          if (redirected) return;
          redirected = true;
          document.body.setAttribute("data-redirected", "true");
          window.location.href = "shop.html";
        }

        const fallbackTimer = setTimeout(doRedirect, CONFIG.REDIRECT_FALLBACK_MS);

        const eventFields = {
          promotion_id: promoId,
          promotion_name: promoName,
          creative_name: creativeName,
          creative_slot: creativeSlot,
          location_id: CONFIG.LOCATION_ID,
          currency: CONFIG.CURRENCY
        };

        // Push select_promotion with eventCallback and eventTimeout in extras
        push(CONFIG.EVENT_SELECT, eventFields, [clickedItem], {
          eventCallback: function() {
            clearTimeout(fallbackTimer);
            doRedirect();
          },
          eventTimeout: CONFIG.REDIRECT_FALLBACK_MS
        });
      });
    });

    // Mark page ready
    document.body.setAttribute("data-ready", "true");
  </script>
</body>
</html>
